[env:esp32-s3-devkitc-1]
; SURUM SABITLENDI - DEGISTIRMEDEN ONCE OKU:
; Motor guvenlik katmani arduino-esp32 2.0.x donanim timer API'sini kullanir
; (timerBegin(num, divider, countUp) / timerAlarmWrite / timerAttachInterruptFlag).
; arduino-esp32 3.x (platform espressif32 >= 51.x) bu API'yi tamamen degistirdi.
; Surum sabitlenmezse ileride yapilacak bir "pio pkg update" motorun donma
; korumasini sessizce bozabilir. Yukseltmek istersen once src/main.cpp icindeki
; safetyTimersInit() / motorOn() fonksiyonlarini yeni API'ye tasi.
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
; upload_port ayarlanmazsa PlatformIO portu otomatik bulur.
; Birden fazla seri cihaz varsa acin:
;   upload_port = COM6            (Windows)
;   upload_port = /dev/ttyACM0    (Linux / macOS)
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Super Mini Kartlar Icin Kritik Bellek ve Flash Ayarlari
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
board_build.partitions = default.csv

build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	; FFT float ile calisiyor (ESP32-S3 FPU tek hassasiyetlidir); -O2 ile
	; ortusmeli pencere analizi rahatlikla gercek zamanli kaliyor.
	-O2

lib_deps =
	h2zero/NimBLE-Arduino@^2.5.0
	adafruit/Adafruit MPU6050@^2.2.6
	adafruit/Adafruit Unified Sensor@^1.1.14
	kosme/arduinoFFT@^2.0.4
